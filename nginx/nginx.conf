
# JSON access log for structured shipping (Vector -> Loki -> R2). This file is
# included inside the base image's http{} block (mounted as conf.d/default.conf),
# so log_format is valid here. Each server below sets `access_log ... json_access`
# to override the image default `main` format. The error_log format is fixed by
# nginx and stays plain text (parsed downstream in Vector).
log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"server_name":"$server_name",'
    '"scheme":"$scheme"'
  '}';

# Grafana Live / websockets need Connection: upgrade to pass through the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP for Frontend, Backend & Grafana : educ-prime.com, api., grafana.
server {
    listen 80;
    server_name educ-prime.com api.educ-prime.com grafana.educ-prime.com;
    access_log /var/log/nginx/access.log json_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for Frontend : educ-prime.com
server {
    listen 443 ssl;
    server_name educ-prime.com;
    access_log /var/log/nginx/access.log json_access;

    ssl_certificate /etc/letsencrypt/live/educ-prime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educ-prime.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS for Backend : api.educ-prime.com
server {
    listen 443 ssl;
    server_name api.educ-prime.com;
    access_log /var/log/nginx/access.log json_access;

    # Set maximum allowed size of client request body
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/educ-prime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educ-prime.com/privkey.pem;

    # Block the internal wallet-credit endpoint at the edge. Nothing external
    # should reach /internal/* (the exam reward is credited in-process on
    # épreuve/concours approval). Defense-in-depth alongside
    # PAYMENT_INTERNAL_API_KEY — the guard fails open if that var is unset.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}

# HTTPS for Grafana : grafana.educ-prime.com
# Uses its OWN certificate lineage (not a SAN on the educ-prime.com cert), so
# grafana cert issuance/renewal never re-keys the api cert (which broke mobile
# certificate pinning).
server {
    listen 443 ssl;
    server_name grafana.educ-prime.com;
    access_log /var/log/nginx/access.log json_access;

    ssl_certificate /etc/letsencrypt/live/grafana.educ-prime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.educ-prime.com/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (websockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
