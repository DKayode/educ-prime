<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <title>Edukia Admin</title>
    <meta name="description" content="Dashboard administrateur Edukia" />

    <!-- Brand assets are served from the shared assets host. The href below
         is the default; on boot, main.tsx fetches GET /app and updates this
         link to whatever app.favicon is in the runtime config, so future
         changes to config.json take effect without a frontend redeploy. -->
    <link id="app-favicon" rel="icon" type="image/x-icon" href="https://assets.edukia.net/app/favicon.ico" />

    <meta property="og:title" content="Edukia Admin" />
    <meta property="og:description" content="Dashboard administrateur Edukia" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://assets.edukia.net/app/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://assets.edukia.net/app/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
