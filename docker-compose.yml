version: '3.8'

services:
  # Redis for BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: edukia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - edukia_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-ghcr.io/dkayode/edukia-backend:latest}
    container_name: edukia_backend
    restart: unless-stopped
    environment:
      # Database — managed Postgres on Neon. Connection string carries
      # credentials, host, db name, and sslmode=require; the previous
      # DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD / DB_NAME variables
      # were leftovers from a local-db setup and are no longer read.
      DATABASE_URL: ${DATABASE_URL}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Node
      NODE_ENV: production
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Cloudflare R2 storage — used by the /files presign + proxy endpoints.
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    networks:
      - edukia_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', (e) => { process.exit(1); })"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # React Frontend Admin Dashboard
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-ghcr.io/dkayode/edukia-frontend:latest}
    container_name: edukia_frontend
    restart: unless-stopped
    networks:
      - edukia_network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: edukia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - edukia_network
    depends_on:
      - frontend
      - backend

  # Certbot
  certbot:
    image: certbot/certbot
    container_name: edukia_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c ' if [ ! -f /etc/letsencrypt/live/educ-prime.com/fullchain.pem ]; then
        certbot certonly --webroot --webroot-path=/var/www/certbot --email support@educ-prime.cloud --agree-tos --no-eff-email -d educ-prime.com -d api.educ-prime.com;
      fi; trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done; '
    networks:
      - edukia_network

networks:
  edukia_network:
    driver: bridge
